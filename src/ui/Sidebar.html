<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      
      /* Dark Mode Glassmorphism Variables */
      --bg-gradient: radial-gradient(180px 180px at 105% 2%, rgba(10,132,255,0.26), transparent 70%),
                     radial-gradient(210px 210px at -10% 18%, rgba(90,200,250,0.20), transparent 70%),
                     radial-gradient(190px 190px at 85% 74%, rgba(52,199,89,0.13), transparent 72%),
                     linear-gradient(135deg, #090d16 0%, #0f172a 45%, #111c35 100%);
      --bg-solid: #090d16;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --accent-blue: #38bdf8;
      --accent-indigo: #6366f1;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;

      --glass-bg: rgba(30, 41, 59, 0.48);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-shadow: 0 16px 38px rgba(0, 0, 0, 0.35);
      
      --btn-bg: rgba(255, 255, 255, 0.04);
      --btn-border: rgba(255, 255, 255, 0.09);
      --btn-hover: rgba(255, 255, 255, 0.09);
      --btn-hover-border: rgba(255, 255, 255, 0.22);
      
      --results-bg: rgba(15, 23, 42, 0.85);
      --pill-bg: rgba(255, 255, 255, 0.03);
      --pill-border: rgba(255, 255, 255, 0.06);

      --radius-xl: 20px;
      --radius-lg: 14px;
      --radius-md: 10px;

      --glow-a: rgba(99, 102, 241, 0.25);
      --glow-b: rgba(56, 189, 248, 0.2);
    }

    /* Adaptive Light Glassmorphism Overrides (Default) */
    [data-theme="light"] {
      --bg-gradient: radial-gradient(180px 180px at 105% 2%, rgba(10,132,255,0.22), transparent 70%),
                     radial-gradient(210px 210px at -10% 18%, rgba(90,200,250,0.18), transparent 70%),
                     radial-gradient(190px 190px at 85% 74%, rgba(52,199,89,0.12), transparent 72%),
                     linear-gradient(145deg, #edf4ff 0%, #f6f7fb 42%, #eef8f4 100%);
      --bg-solid: #f4f7fc;
      --text-main: #0b1220;
      --text-muted: #667085;
      --text-dim: #7a8494;
      
      --accent-blue: #0284c7;
      --accent-indigo: #4338ca;
      --accent-emerald: #059669;
      --accent-amber: #d97706;
      --accent-rose: #dc2626;

      --glass-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.42));
      --glass-border: rgba(255, 255, 255, 0.85);
      --glass-shadow: 0 18px 45px rgba(31, 41, 55, 0.12);
      
      --btn-bg: rgba(255, 255, 255, 0.52);
      --btn-border: rgba(255, 255, 255, 0.75);
      --btn-hover: rgba(255, 255, 255, 0.85);
      --btn-hover-border: rgba(255, 255, 255, 0.95);
      
      --results-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.65));
      --pill-bg: rgba(245, 247, 250, 0.65);
      --pill-border: rgba(255, 255, 255, 0.8);

      --glow-a: rgba(10, 132, 255, 0.15);
      --glow-b: rgba(52, 199, 89, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background: var(--bg-solid);
      background-image: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px 14px 24px;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* Ambient Floating Glass Blur Circles */
    body::before {
      content: "";
      position: fixed;
      width: 180px;
      height: 180px;
      top: -50px;
      right: -60px;
      border-radius: 50%;
      background: var(--glow-a);
      filter: blur(36px);
      pointer-events: none;
      animation: floatGlowA 8s ease-in-out infinite alternate;
    }

    body::after {
      content: "";
      position: fixed;
      width: 160px;
      height: 160px;
      bottom: 40px;
      left: -70px;
      border-radius: 50%;
      background: var(--glow-b);
      filter: blur(34px);
      pointer-events: none;
      animation: floatGlowB 10s ease-in-out infinite alternate;
    }

    .app-container {
      position: relative;
      z-index: 1;
      animation: fadeIn .45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Header Section */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding: 2px 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon-wrapper {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(145deg, rgba(255,255,255,0.7), rgba(255,255,255,0.3));
      border: 1px solid var(--glass-border);
      display: grid;
      place-items: center;
      font-size: 18px;
      flex-shrink: 0;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 8px 20px rgba(10,132,255,0.15);
      backdrop-filter: blur(12px);
    }

    [data-theme="dark"] .brand-icon-wrapper {
      background: linear-gradient(135deg, rgba(99,102,241,0.25) 0%, rgba(56,189,248,0.15) 100%);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .brand-titles h1 {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.35px;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .brand-titles p {
      font-size: 10.5px;
      color: var(--text-muted);
      font-weight: 500;
      white-space: nowrap;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .theme-toggle-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--text-main);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 15px;
      backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 4px 12px rgba(0,0,0,0.06);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
    }

    .theme-toggle-btn:hover {
      background: var(--btn-hover);
      border-color: var(--btn-hover-border);
      transform: scale(1.08) translateY(-1px);
    }

    /* Ultra Glassmorphism Cards */
    .glass-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: 15px;
      margin-bottom: 14px;
      backdrop-filter: blur(25px) saturate(145%);
      -webkit-backdrop-filter: blur(25px) saturate(145%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), var(--glass-shadow);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card-label {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .card-label::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--text-dim), transparent);
      opacity: 0.2;
    }

    /* Buttons Stack */
    .button-stack {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .btn {
      position: relative;
      width: 100%;
      border: 1px solid var(--btn-border);
      border-radius: var(--radius-lg);
      padding: 11px 13px;
      display: flex;
      align-items: center;
      gap: 11px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 750;
      color: var(--text-main);
      background: var(--btn-bg);
      backdrop-filter: blur(14px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 5px 15px rgba(31, 41, 55, 0.05);
      cursor: pointer;
      outline: none;
      white-space: nowrap;
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 20%, rgba(255, 255, 255, 0.45) 50%, transparent 80%);
      transform: translateX(-130%);
      transition: transform 0.55s ease;
      pointer-events: none;
    }

    .btn:hover:not(:disabled)::before {
      transform: translateX(130%);
    }

    .btn:hover:not(:disabled) {
      background: var(--btn-hover);
      border-color: var(--btn-hover-border);
      transform: translateY(-2px) scale(1.008);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 9px 22px rgba(31, 41, 55, 0.1);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.975);
    }

    .btn:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .btn-icon {
      width: 30px;
      height: 30px;
      border-radius: var(--radius-md);
      display: grid;
      place-items: center;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
      flex-shrink: 0;
      transition: transform 0.25s ease;
    }

    [data-theme="dark"] .btn-icon {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .btn:hover:not(:disabled) .btn-icon {
      transform: scale(1.1);
    }

    /* Button Variants */
    .btn-primary {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.34);
      background: linear-gradient(135deg, #087cf1 0%, #168cff 52%, #0a84ff 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 10px 24px rgba(10, 132, 255, 0.25);
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #066ecb 0%, #0d7ee6 52%, #0875e1 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 12px 28px rgba(10, 132, 255, 0.38);
    }

    .btn-primary .btn-icon {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn-amber {
      color: #ffffff;
      background: linear-gradient(135deg, #ff9500 0%, #ffab18 100%);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 10px 24px rgba(255, 149, 0, 0.22);
    }

    .btn-amber:hover:not(:disabled) {
      background: linear-gradient(135deg, #e08300 0%, #f09e0a 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 12px 28px rgba(255, 149, 0, 0.32);
    }

    .btn-amber .btn-icon {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn-danger {
      color: #ffffff;
      background: linear-gradient(135deg, #ff3b30 0%, #ff5e55 100%);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 10px 24px rgba(255, 59, 48, 0.22);
    }

    .btn-danger:hover:not(:disabled) {
      background: linear-gradient(135deg, #e02d23 0%, #ed4d44 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 12px 28px rgba(255, 59, 48, 0.32);
    }

    .btn-danger .btn-icon {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* Working Progress Banner */
    .working-box {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 14px 16px;
      border-radius: var(--radius-lg);
      color: var(--text-main);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), var(--glass-shadow);
      backdrop-filter: blur(22px);
      margin-bottom: 14px;
      animation: slideDown 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    [data-theme="dark"] .working-box {
      background: rgba(30, 41, 59, 0.65);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .working-box.show { display: flex; }

    .working-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .working-info b {
      display: block;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.2px;
    }

    .working-info span {
      display: block;
      font-size: 9.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .progress-badge {
      font-size: 12px;
      font-weight: 800;
      color: var(--accent-blue);
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 2px 8px;
      border-radius: 16px;
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    [data-theme="dark"] .progress-bar-container {
      background: rgba(255, 255, 255, 0.08);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8 0%, #6366f1 50%, #10b981 100%);
      background-size: 200% 100%;
      border-radius: 10px;
      transition: width 0.25s ease-out;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 9.5px;
      color: var(--text-dim);
      font-weight: 600;
    }

    /* Execution Results Card */
    .results-card {
      display: none;
      position: relative;
      border-radius: var(--radius-xl);
      padding: 15px;
      margin-bottom: 14px;
      background: var(--results-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(30px) saturate(155%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), var(--glass-shadow);
      animation: resultIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .results-card.show { display: block; }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--text-muted);
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
      z-index: 2;
    }

    .close-btn:hover {
      background: rgba(244, 63, 94, 0.2);
      color: var(--accent-rose);
      border-color: rgba(244, 63, 94, 0.4);
      transform: scale(1.1);
    }

    .results-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-right: 24px;
    }

    .status-badge-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 800;
      flex-shrink: 0;
      box-shadow: inset 0 1px 0 #fff;
    }

    .status-badge-icon.success {
      color: #178b48;
      background: linear-gradient(145deg, rgba(232,250,239,0.92), rgba(210,244,222,0.62));
      border: 1px solid rgba(52,199,89,0.3);
    }

    .status-badge-icon.warning {
      color: #bd6b00;
      background: linear-gradient(145deg, rgba(255,245,224,0.94), rgba(255,231,193,0.65));
      border: 1px solid rgba(255,149,0,0.3);
    }

    .status-badge-icon.error {
      color: #d62f27;
      background: linear-gradient(145deg, rgba(255,237,235,0.94), rgba(255,215,211,0.66));
      border: 1px solid rgba(255,59,48,0.3);
    }

    .results-title-group h2 {
      font-size: 13.5px;
      font-weight: 780;
      letter-spacing: -0.25px;
      color: var(--text-main);
    }

    .results-title-group p {
      font-size: 9.5px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
      margin-bottom: 10px;
    }

    .stat-pill {
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      border-radius: var(--radius-md);
      padding: 8px 10px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
      transition: transform 0.2s ease;
    }

    .stat-pill:hover { transform: translateY(-1px); }

    .stat-value {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.1;
    }

    .stat-label {
      font-size: 8.5px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 3px;
    }

    .message-box {
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      border-radius: var(--radius-md);
      padding: 9px 11px;
      font-size: 10.5px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .details-box {
      margin-top: 8px;
      max-height: 130px;
      overflow-y: auto;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      border-radius: var(--radius-md);
      padding: 8px 10px;
      font-size: 9px;
      font-family: monospace;
      color: var(--text-main);
      white-space: pre-wrap;
      line-height: 1.45;
    }

    .footer {
      text-align: center;
      font-size: 9px;
      color: var(--text-dim);
      padding: 6px 0;
      letter-spacing: 0.2px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px) scale(0.985); } to { opacity: 1; transform: none; } }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    @keyframes resultIn { from { opacity: 0; transform: translateY(10px) scale(0.97); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
    @keyframes floatGlowA { 0%, 100% { transform: translate3d(0,0,0); } 50% { transform: translate3d(-8px,10px,0); } }
    @keyframes floatGlowB { 0%, 100% { transform: translate3d(0,0,0); } 50% { transform: translate3d(10px,-7px,0); } }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Top Header -->
    <div class="header">
      <div class="brand-group">
        <div class="brand-icon-wrapper">📋</div>
        <div class="brand-titles">
          <h1>Sheet Manager</h1>
          <p>Glass Control Center</p>
        </div>
      </div>
      
      <div class="header-controls">
        <button id="themeToggle" class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Dark/Light Theme">
          🌙
        </button>
      </div>
    </div>

    <!-- Core Actions Card -->
    <div class="glass-card">
      <div class="card-label">Workflows</div>
      <div class="button-stack">
        <button class="btn btn-primary" onclick="run('createMonthlySheetsSafe', this)">
          <span class="btn-icon">🚀</span>
          <span>Create Monthly Sheets</span>
        </button>

        <button class="btn" onclick="run('previewMonthlySheets', this)">
          <span class="btn-icon">🔍</span>
          <span>Run Safe Preview</span>
        </button>

        <button class="btn btn-amber" onclick="run('retryFailedRows', this)">
          <span class="btn-icon">🔄</span>
          <span>Retry Failed Rows</span>
        </button>
      </div>
    </div>

    <!-- Maintenance Card -->
    <div class="glass-card">
      <div class="card-label">Maintenance</div>
      <div class="button-stack">
        <button class="btn btn-danger" onclick="run('clearProcessingStatus', this)">
          <span class="btn-icon">🧹</span>
          <span>Clear Status & Headers</span>
        </button>
      </div>
    </div>

    <!-- Working Progress Indicator -->
    <div id="working" class="working-box">
      <div class="working-header">
        <div class="working-info">
          <b id="workingText">Processing Request…</b>
          <span id="workingSubText">Please keep sidebar open during execution.</span>
        </div>
        <div class="progress-badge" id="progressPercentage">0%</div>
      </div>

      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progressBarFill" style="width: 0%;"></div>
      </div>

      <div class="progress-meta">
        <span id="progressStatus">Initializing…</span>
        <span id="progressEta">⏱️ Estimating time…</span>
      </div>
    </div>

    <!-- Execution Results Dashboard -->
    <div id="result" class="results-card">
      <button class="close-btn" onclick="closeResults()" title="Close Notification">✕</button>

      <div class="results-header">
        <div id="resultIcon" class="status-badge-icon success">✓</div>
        <div class="results-title-group">
          <h2 id="resultTitle">Process Complete</h2>
          <p id="resultSub">Finished successfully</p>
        </div>
      </div>

      <div id="stats" class="stats-grid"></div>
      <div id="message" class="message-box"></div>
      <div id="details" class="details-box" style="display:none"></div>
    </div>

    <!-- Footer Note -->
    <div class="footer">
      MIS Control Center • K41L3Y
    </div>
  </div>

  <script>
    var busy = false;

    function toggleTheme() {
      var currentTheme = document.documentElement.getAttribute('data-theme');
      var newTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', newTheme);
      document.getElementById('themeToggle').textContent = newTheme === 'light' ? '☀️' : '🌙';
    }

    function closeResults() {
      var card = document.getElementById('result');
      card.classList.remove('show');
      card.style.display = 'none';
    }

    function updateProgress(percent, statusText, etaText) {
      var bar = document.getElementById('progressBarFill');
      var badge = document.getElementById('progressPercentage');
      var status = document.getElementById('progressStatus');
      var eta = document.getElementById('progressEta');

      percent = Math.min(100, Math.max(0, Math.round(percent)));
      if (bar) bar.style.width = percent + '%';
      if (badge) badge.textContent = percent + '%';
      if (status && statusText != null) status.textContent = statusText;
      if (eta && etaText != null) eta.textContent = etaText;
    }

    function setWorking(on, text, subText) {
      var box = document.getElementById('working');
      var label = document.getElementById('workingText');
      var sub = document.getElementById('workingSubText');
      box.classList.toggle('show', on);
      if (label) label.textContent = text || 'Processing Request…';
      if (sub) sub.textContent = subText || 'Please keep sidebar open during execution.';
      if (on) {
        updateProgress(0, 'Initializing workflow…', '⏱️ Estimating time…');
      }
    }

    function showResult(result) {
      result = result || {};

      var card = document.getElementById('result');
      var icon = document.getElementById('resultIcon');
      var title = document.getElementById('resultTitle');
      var sub = document.getElementById('resultSub');
      var stats = document.getElementById('stats');
      var message = document.getElementById('message');
      var details = document.getElementById('details');

      var type = result.type || 'success';

      icon.className = 'status-badge-icon ' + type;
      icon.textContent = (type === 'error') ? '✕' : (type === 'warning') ? '!' : '✓';

      title.textContent = result.title || 'Process Complete';
      sub.textContent = (result.seconds != null) ? ('Finished in ' + result.seconds + ' seconds') : 'Execution complete';

      stats.innerHTML = '';
      var items = [
        ['Created', result.created],
        ['Already Exists', result.existing],
        ['Skipped', result.skipped],
        ['Errors', result.errors]
      ];

      items.forEach(function(item) {
        if (item[1] != null) {
          stats.innerHTML += 
            '<div class="stat-pill">' +
              '<div class="stat-value">' + escapeHtml(item[1]) + '</div>' +
              '<div class="stat-label">' + escapeHtml(item[0]) + '</div>' +
            '</div>';
        }
      });

      message.textContent = result.message || '';

      if (result.details && result.details.length) {
        details.style.display = 'block';
        details.textContent = result.details.join('\n') + (result.more ? ('\n\n… and ' + result.more + ' more.') : '');
      } else {
        details.style.display = 'none';
        details.textContent = '';
      }

      card.style.display = 'block';
      card.classList.remove('show');
      void card.offsetWidth;
      card.classList.add('show');

      setTimeout(function() {
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 50);
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function run(fn, button) {
      if (busy) return;
      busy = true;

      document.querySelectorAll('button').forEach(function(b) {
        b.disabled = true;
      });

      var workingText =
        fn === 'createMonthlySheetsSafe' ? 'Creating monthly sheets…' :
        fn === 'previewMonthlySheets' ? 'Building safe preview…' :
        fn === 'retryFailedRows' ? 'Retrying failed rows…' : 'Clearing status and headers…';

      setWorking(true, workingText);

      if (fn === 'clearProcessingStatus') {
        var clearProgress = 0;
        var clearTimer = setInterval(function() {
          if (clearProgress < 90) {
            clearProgress += 15;
            updateProgress(clearProgress, 'Cleaning status columns…', 'Almost done…');
          }
        }, 150);

        google.script.run
          .withSuccessHandler(function(result) {
            clearInterval(clearTimer);
            updateProgress(100, 'Status Cleared', 'Complete!');
            setTimeout(function() {
              busy = false;
              document.querySelectorAll('button').forEach(function(b) { b.disabled = false; });
              setWorking(false);
              showResult(result);
            }, 300);
          })
          .withFailureHandler(function(err) {
            clearInterval(clearTimer);
            busy = false;
            document.querySelectorAll('button').forEach(function(b) { b.disabled = false; });
            setWorking(false);
            showResult({
              type: 'error',
              title: 'Execution Error',
              message: err && err.message ? err.message : String(err),
              created: 0, existing: 0, skipped: 0, errors: 1
            });
          })
          .clearProcessingStatus();
        return;
      }

      // Batch execution with real-time 0-100% progress & ETA
      google.script.run
        .withSuccessHandler(function(plan) {
          if (!plan || plan.error) {
            busy = false;
            document.querySelectorAll('button').forEach(function(b) { b.disabled = false; });
            setWorking(false);
            showResult(plan ? plan.result : {
              type: 'error',
              title: 'Execution Error',
              message: 'Failed to fetch execution plan.',
              created: 0, existing: 0, skipped: 0, errors: 1
            });
            return;
          }

          var totalRows = plan.totalRows;
          var rows = plan.rows;
          var completed = 0;
          var startTime = Date.now();
          var accumulated = {
            type: 'success',
            title: fn === 'previewMonthlySheets' ? 'Preview Only' : (fn === 'retryFailedRows' ? 'Retry Completed' : 'Process Complete'),
            message: fn === 'previewMonthlySheets' ? 'No changes were made. This is only a preview.' : 'Monthly sheet processing completed.',
            created: 0,
            existing: 0,
            skipped: 0,
            errors: 0,
            details: []
          };

          if (totalRows === 0) {
            updateProgress(100, 'No rows to process', 'Done!');
            setTimeout(function() {
              busy = false;
              document.querySelectorAll('button').forEach(function(b) { b.disabled = false; });
              setWorking(false);
              showResult(accumulated);
            }, 300);
            return;
          }

          function processNextBatch() {
            if (completed >= totalRows) {
              var elapsedSec = Number(((Date.now() - startTime) / 1000).toFixed(1));
              accumulated.seconds = elapsedSec;
              if (accumulated.errors > 0) {
                accumulated.type = 'warning';
                accumulated.title = 'Completed with Errors';
              }

              updateProgress(100, 'Processing Complete!', '100% Done');
              setTimeout(function() {
                busy = false;
                document.querySelectorAll('button').forEach(function(b) { b.disabled = false; });
                setWorking(false);
                showResult(accumulated);
              }, 400);
              return;
            }

            var nextRow = rows[completed];
            var batchRows = [nextRow];

            google.script.run
              .withSuccessHandler(function(batchRes) {
                completed += batchRows.length;
                if (batchRes) {
                  accumulated.created += (batchRes.created || 0);
                  accumulated.existing += (batchRes.existing || 0);
                  accumulated.skipped += (batchRes.skipped || 0);
                  accumulated.errors += (batchRes.errors || 0);
                  if (batchRes.details && batchRes.details.length) {
                    accumulated.details = accumulated.details.concat(batchRes.details);
                  }
                }

                var percent = (completed / totalRows) * 100;
                var elapsedMs = Date.now() - startTime;
                var avgMsPerRow = elapsedMs / completed;
                var remainMs = Math.ceil((totalRows - completed) * avgMsPerRow);
                var remainSec = Math.max(1, Math.ceil(remainMs / 1000));
                
                var etaStr = completed === totalRows ? 'Finishing…' : ('⏱️ ~' + remainSec + 's remaining');
                var statusStr = 'Row ' + completed + ' of ' + totalRows + ' (' + Math.round(percent) + '%)';

                updateProgress(percent, statusStr, etaStr);
                processNextBatch();
              })
              .withFailureHandler(function(err) {
                completed += batchRows.length;
                accumulated.errors += 1;
                accumulated.details.push('Row ' + nextRow + ' → ERROR: ' + (err && err.message ? err.message : String(err)));

                var percent = (completed / totalRows) * 100;
                updateProgress(percent, 'Row ' + completed + ' of ' + totalRows + ' (Error)', 'Continuing…');
                processNextBatch();
              })
              .executeRowBatch(fn, batchRows);
          }

          updateProgress(0, 'Row 0 of ' + totalRows, 'Calculating ETA…');
          processNextBatch();
        })
        .withFailureHandler(function(err) {
          busy = false;
          document.querySelectorAll('button').forEach(function(b) { b.disabled = false; });
          setWorking(false);
          showResult({
            type: 'error',
            title: 'Execution Error',
            message: err && err.message ? err.message : String(err),
            created: 0, existing: 0, skipped: 0, errors: 1
          });
        })
        .getExecutionPlan(fn);
    }
  </script>
</body>
</html>
